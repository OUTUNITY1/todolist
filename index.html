<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App - Firebase</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <div class="logo">
        <i class="fa-solid fa-check-double"></i>
        <h1>Todo App</h1>
      </div>
      <p class="subtitle">Đăng nhập để quản lý công việc của bạn</p>

      <form id="email-login-form">
        <div class="input-group">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="login-email" placeholder="Email" required />
        </div>
        <div class="input-group">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="login-password" placeholder="Mật khẩu" required />
        </div>
        <button type="submit" class="btn btn-primary" id="btn-email-login">
          <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập bằng Email
        </button>
      </form>

      <div class="divider"><span>hoặc</span></div>

      <button class="btn btn-google" id="btn-google-login">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
        Đăng nhập bằng Google
      </button>

      <p class="note">* Chỉ đăng nhập – không có chức năng đăng ký</p>
      <p class="contact">Liên hệ: <a href="mailto:lga775385@gmail.com">lga775385@gmail.com</a></p>
    </div>
  </div>

  <!-- APP SCREEN -->
  <div id="app-screen" class="screen hidden">
    <header class="header">
      <div class="header-left">
        <i class="fa-solid fa-check-double"></i>
        <span>Todo App</span>
      </div>
      <div class="header-right">
        <span id="user-email" class="user-email"></span>
        <button id="btn-logout" class="btn-logout" title="Đăng xuất">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <main class="main">
      <!-- Create Task -->
      <section class="create-task">
        <form id="create-task-form">
          <input type="text" id="task-title" placeholder="Thêm công việc mới..." required maxlength="120" />
          <button type="submit" class="btn-add" title="Thêm">
            <i class="fa-solid fa-plus"></i>
          </button>
        </form>
      </section>

      <!-- Tabs -->
      <nav class="tabs">
        <button class="tab active" data-filter="all">Tất cả <span id="count-all">0</span></button>
        <button class="tab" data-filter="active">Đang làm <span id="count-active">0</span></button>
        <button class="tab" data-filter="completed">Hoàn thành <span id="count-completed">0</span></button>
      </nav>

      <!-- Task List -->
      <ul id="task-list" class="task-list"></ul>

      <div id="empty-state" class="empty-state hidden">
        <i class="fa-regular fa-clipboard"></i>
        <p>Chưa có công việc nào</p>
      </div>
    </main>

    <footer class="footer">
      <p>Liên hệ: <a href="mailto:lga775385@gmail.com">lga775385@gmail.com</a></p>
    </footer>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
